# Supabase CLI 設定。project_id 只是本機識別名，真正的專案用 `supabase link --project-ref <ref>` 連。
project_id = "japan-trip"

# 兩個 Edge Function 自己用 getUser() 驗證登入與家庭，所以關掉 gateway 的 JWT 檢查。
[functions.parse-upload]
verify_jwt = false

[functions.chat]
verify_jwt = false

# 登入後導回的網址：正式站和本機開發
[auth]
site_url = "https://royyeh007.github.io/japan-trip/"
additional_redirect_urls = ["https://royyeh007.github.io/japan-trip/**", "http://localhost:5173/**"]

# Google 登入。Client ID / Secret 放在 .env.local 的 GOOGLE_CLIENT_ID、GOOGLE_CLIENT_SECRET，用 `make auth-push` 推上去。
# 直接跑 `supabase config push` 而沒設這兩個環境變數會失敗，這是故意的。
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
