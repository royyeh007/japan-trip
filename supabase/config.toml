# Supabase CLI 設定。project_id 只是本機識別名，真正的專案用 `supabase link --project-ref <ref>` 連。
project_id = "japan-trip"

# 兩個 Edge Function 自己用 getUser() 驗證登入與家庭，所以關掉 gateway 的 JWT 檢查。
[functions.parse-upload]
verify_jwt = false

[functions.chat]
verify_jwt = false

# 登入後導回的網址：正式站和本機開發
[auth]
site_url = "https://royyeh007.github.io/japan-trip/"
additional_redirect_urls = ["https://royyeh007.github.io/japan-trip/**", "http://localhost:5173/**"]
# 邀請連結進入 = 匿名登入
enable_anonymous_sign_ins = true

# （選用）Google 登入。要開的話把下面三行取消註解，Client ID / Secret 放 .env.local，跑 `make auth-push`，
# 並在 GitHub Variables 設 VITE_GOOGLE_LOGIN=1 讓登入頁顯示 Google 按鈕。
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_CLIENT_SECRET)"
